name: Koprik
options:
  bundleIdPrefix: uz.koprik
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KoprikKit:
    path: KoprikKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Koprik:
    type: application
    platform: macOS
    sources:
      - path: Koprik
    dependencies:
      - package: KoprikKit
        product: KoprikKit
      - package: Sparkle
        product: Sparkle
      - target: KoprikThumbnail
        embed: true
        codeSign: true
    info:
      path: Koprik/Info.plist
      properties:
        CFBundleDisplayName: Ko'prik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "MIT License. Wine is LGPL and is downloaded separately."
        CFBundleLocalizations: [en, uz, ru]
        CFBundleDevelopmentRegion: en
        SUFeedURL: https://raw.githubusercontent.com/Xazratbek/koprik/main/appcast.xml
        SUPublicEDKey: PPbVt5c9ObuFrgsloeiaMWI3Gcwmt5Kw6jlvZvPbuAo=
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: uz.koprik.app
            CFBundleURLSchemes: [koprik]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Windows program
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.microsoft.windows-executable
              - com.microsoft.msi-installer
              - com.microsoft.windows-shortcut
              - com.microsoft.bat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.koprik.app
        PRODUCT_NAME: Koprik
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Wine is started as a child process and reads the whole disk, which the sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  KoprikThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: KoprikThumbnail
    dependencies:
      - package: KoprikKit
        product: KoprikKit
    info:
      path: KoprikThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Ko'prik Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.microsoft.windows-executable
            QLThumbnailMinimumDimension: 16
    entitlements:
      path: KoprikThumbnail/KoprikThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.koprik.app.thumbnail
        PRODUCT_NAME: KoprikThumbnail
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  Koprik:
    build:
      targets:
        Koprik: all
    run:
      config: Debug
    archive:
      config: Release
